# SQLite is the default local database so development works on Windows without
# a running PostgreSQL service.
#
# To re-enable PostgreSQL later, add `gem "pg", "~> 1.1"` to the Gemfile and
# switch the relevant environment adapter to `postgresql`.

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# Production can use PostgreSQL when deployed. Keep pg disabled locally unless
# you intentionally re-enable it in the Gemfile.
production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: political_app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: political_app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: political_app_production_cable
    migrations_paths: db/cable_migrate
