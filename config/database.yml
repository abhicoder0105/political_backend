# SQLite is the default local database so development works on Windows without
# a running PostgreSQL service.
#
# To re-enable PostgreSQL later, add `gem "pg", "~> 1.1"` to the Gemfile and
# switch the relevant environment adapter to `postgresql`.

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# Production uses PostgreSQL via DATABASE_URL (provided by Render).
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
